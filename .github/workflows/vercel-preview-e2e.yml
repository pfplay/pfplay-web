name: preview deploy and e2e

on:
  push:
    branches: [development]
  workflow_dispatch:

# 동시 run들이 공유 stg.pfplay.xyz 별칭을 레이스하지 않도록 파이프라인 직렬화 (이슈 #348).
# 연속 머지 시 직전 run 취소 → 최신 development 상태만 deploy+e2e.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    name: deploy preview
    runs-on: ubuntu-latest
    outputs:
      preview_url: ${{ steps.deploy.outputs.url }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      # vercel@53.3.0 이 broken transitive dep (@vercel/cli-config 404) 으로
      # publish 됨. 안전한 직전 stable 로 pin — vercel 측 fix 후 풀거나 신규 stable 로 bump.
      - name: Deploy to Vercel Preview
        id: deploy
        run: |
          URL=$(npx vercel@48.4.1 deploy --scope dev-8226s-projects --yes --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$URL" >> $GITHUB_OUTPUT

      - name: Alias Preview Domain
        run: |
          npx vercel@48.4.1 alias set ${{ steps.deploy.outputs.url }} stg.pfplay.xyz --scope dev-8226s-projects --token=${{ secrets.VERCEL_TOKEN }}

  e2e:
    name: Playwright E2E
    needs: deploy
    if: ${{ needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: Preview – pfplay-web
    env:
      E2E_BASE_URL: https://stg.pfplay.xyz

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20.19.0'

      - run: npm i -g yarn@1.22.22
      - run: yarn

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ hashFiles('**/yarn.lock') }}

      - run: npx playwright install --with-deps chromium

      # web#303: 매 run 새로 배포되는 Vercel preview 프론트는 구조상 cold —
      # serverless/SSR 함수의 첫 히트가 느려 me-fetch-게이트 ProtectedLayout
      # 사이드바(Playlist 버튼)가 30s 안에 안 그려져 E2E 가 만성 flake.
      # yarn install/playwright install 동안 함수가 다시 식으므로, 테스트 직전
      # 에 핵심 경로를 다회 선접속해 함수 인스턴스를 데운다(best-effort, 실패해도
      # 테스트 진행). Vercel 배포 보호 우회 헤더 필수 — 없으면 보호 월만 데움.
      - name: Warm up preview (mitigate cold-start flake — web#303)
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          set +e
          routes="/ /sign-in /parties"
          for pass in 1 2 3; do
            for r in $routes; do
              out=$(curl -s -o /dev/null -w "%{http_code} %{time_total}s" \
                -H "x-vercel-protection-bypass: $VERCEL_AUTOMATION_BYPASS_SECRET" \
                --max-time 60 "$E2E_BASE_URL$r")
              echo "warm pass$pass $r -> $out"
            done
          done
          exit 0

      - run: yarn test:e2e
        env:
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
